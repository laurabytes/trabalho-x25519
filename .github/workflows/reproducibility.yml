name: reproducao

permissions:
  contents: write

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: instala dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: simula ECDLP de referencia
        run: python src/ecdlog_shor.py --shots 4096 --secret 3 --seed 20261110
      - name: executa circuito Qiskit Aer
        run: python src/ecdlog_qiskit.py --shots 1024 --secret 3 --seed 20261126
      - name: executa benchmark PQC
        run: python src/benchmark_pqc.py --repetitions 30
      - name: gera tabelas e graficos
        run: python src/benchmark_sizes.py
      - name: valida resultados
        run: python src/validate_artifacts.py
      - name: executa testes
        run: python -m unittest discover -s tests -v
      - name: salva resultados
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ figures/
          if git diff --cached --quiet; then
            echo "sem alteracoes nos resultados."
          else
            git commit -m "atualiza resultados"
            git push
          fi
      - name: publica resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-data-and-figures
          path: |
            data/
            figures/
